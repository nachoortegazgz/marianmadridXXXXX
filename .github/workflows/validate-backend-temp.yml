name: Temporary backend validation report

on:
  push:
    branches:
      - cleanup/sdk-minimal-backend-2026-10-26
    paths:
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/validate-backend-temp.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/cleanup/sdk-minimal-backend-2026-10-26'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/sdk-minimal-backend-2026-10-26
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install locked dependencies
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts > "$RUNNER_TEMP/install.log" 2>&1
          echo $? > "$RUNNER_TEMP/install.status"
      - name: Run regression and lint; save report
        shell: bash
        run: |
          set +e
          install_status=$(cat "$RUNNER_TEMP/install.status")
          test_status=not-run
          lint_status=not-run
          if [ "$install_status" = 0 ]; then
            npm test > "$RUNNER_TEMP/backend-tests.log" 2>&1
            test_status=$?
            npm run lint -- --format json > "$RUNNER_TEMP/lint.json" 2> "$RUNNER_TEMP/lint.stderr"
            lint_status=$?
          fi
          {
            echo '# Temporary validation report'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "npm ci exit: $install_status"
            echo "npm test exit: $test_status"
            echo "ESLint exit: $lint_status"
            echo
            echo '## Test summary'
            if [ -f "$RUNNER_TEMP/backend-tests.log" ]; then
              grep -E 'TOTAL:|not ok|# fail|# pass|Error:|AssertionError' "$RUNNER_TEMP/backend-tests.log" | tail -n 100 || true
            else
              tail -n 80 "$RUNNER_TEMP/install.log"
            fi
            echo
            echo '## Lint summary'
            if [ -f "$RUNNER_TEMP/lint.json" ]; then
              node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));let e=0,w=0;for(const f of p){e+=f.errorCount||0;w+=f.warningCount||0}console.log(JSON.stringify({files:p.length,errors:e,warnings:w}))" "$RUNNER_TEMP/lint.json"
            elif [ -f "$RUNNER_TEMP/lint.stderr" ]; then
              tail -n 40 "$RUNNER_TEMP/lint.stderr"
            fi
          } > docs/CI-TEMP-REPORT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CI-TEMP-REPORT.md
          git commit -m 'Record temporary validation results' || exit 0
          git push origin HEAD:cleanup/sdk-minimal-backend-2026-10-26
