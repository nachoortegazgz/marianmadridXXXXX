name: Temporary SDK lockfile regeneration

on:
  push:
    branches:
      - cleanup/sdk-minimal-backend-2026-10-26
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/regenerate-lockfile-temp.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/cleanup/sdk-minimal-backend-2026-10-26'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/sdk-minimal-backend-2026-10-26
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Verify recommended eCommerce SDK version exists
        run: npm view @wix/ecom@1.0.2542 version
      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package.json.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Regenerate lockfile for current Wix SDK dependencies'
          git push origin HEAD:cleanup/sdk-minimal-backend-2026-10-26
