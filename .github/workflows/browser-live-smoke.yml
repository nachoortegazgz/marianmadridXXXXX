name: Browser live smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Install temporary browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify real browser homepage and booking route
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              await page.goto("https://www.marianmadrid.es/", {
                waitUntil: "commit",
                timeout: 30000
              });
              await page.waitForTimeout(5000);
              const homeUrl = new URL(page.url());
              const homeText = await page.locator("body").innerText({ timeout: 15000 });
              const reachedCatalog = homeUrl.pathname.replace(/\/$/, "") === "/reserva-online";
              const hasHomeCallToAction = /Reserva Online 24\/7|RESERVA 24\/7|RESÉRVALO AHORA|Catálogo de Servicios/i.test(homeText);
              if (!reachedCatalog && !hasHomeCallToAction) {
                throw new Error("Homepage neither redirects to the service catalog nor presents a booking/catalog call to action.");
              }
              console.log("HOME_FINAL_URL=" + page.url());
              console.log("HOME_CTA_OK=" + hasHomeCallToAction);

              await page.goto("https://www.marianmadrid.es/booking-calendar/rayos-v", {
                waitUntil: "commit",
                timeout: 30000
              });
              await page.waitForTimeout(5000);
              const bookingUrl = new URL(page.url());
              const bookingText = await page.locator("body").innerText({ timeout: 15000 });
              if (!bookingUrl.pathname.includes("/booking-calendar/rayos-v")) {
                throw new Error("Booking navigation did not remain on the Rayos V calendar route.");
              }
              if (/404\s+not found|page not found/i.test(bookingText) || bookingText.trim().length < 40) {
                throw new Error("Booking calendar route appears to be an error or empty page.");
              }
              console.log("BOOKING_URL=" + page.url());
              console.log("BOOKING_TEXT_LENGTH=" + bookingText.trim().length);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
