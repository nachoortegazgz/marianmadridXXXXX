name: Browser live smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Install temporary browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify real browser homepage and booking route
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              await page.goto("https://www.marianmadrid.es/", {
                waitUntil: "domcontentloaded",
                timeout: 60000
              });
              await page.waitForURL(
                url => url.pathname.replace(/\/$/, "") === "/reserva-online",
                { timeout: 20000 }
              );
              const homeText = await page.locator("body").innerText();
              if (!/Catálogo de Servicios|Servicios/i.test(homeText)) {
                throw new Error("Homepage fallback reached the route but catalog content was not found.");
              }
              console.log("HOME_FINAL_URL=" + page.url());

              await page.goto("https://www.marianmadrid.es/booking-calendar/rayos-v", {
                waitUntil: "domcontentloaded",
                timeout: 60000
              });
              await page.waitForTimeout(3000);
              const bookingText = await page.locator("body").innerText();
              if (!/Rayos V|reserva|reservar|calendario/i.test(bookingText)) {
                throw new Error("Booking calendar route loaded but expected service/booking text was not found.");
              }
              if (/404\s+not found|page not found/i.test(bookingText)) {
                throw new Error("Booking calendar route displayed a not-found page.");
              }
              console.log("BOOKING_URL=" + page.url());
              console.log("BOOKING_CONTENT_OK");
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
