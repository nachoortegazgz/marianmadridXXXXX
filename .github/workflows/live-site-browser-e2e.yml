name: Live site browser E2E diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/e2e/**"
      - ".github/workflows/live-site-browser-e2e.yml"
  push:
    branches: [main]
    paths:
      - "tests/e2e/**"
      - ".github/workflows/live-site-browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-diagnostics:
    name: Browser checks (read-only; no bookings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public-site browser diagnostics
        run: node tests/e2e/live-site-browser-diagnostic.mjs
