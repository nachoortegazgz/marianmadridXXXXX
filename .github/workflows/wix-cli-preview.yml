name: Wix CLI preview

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wix.config.json"
      - "package.json"
      - ".github/workflows/wix-cli-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "wix.config.json"
      - "package.json"
      - ".github/workflows/wix-cli-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wix-cli-preview-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Check Wix CLI API key secret
        id: wix-key
        env:
          WIX_CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "$WIX_CLI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Wix preview skipped. Add repository secret CLI_API_KEY with the 'Wix CLI for Sites - Git Integration' permission."
            echo "Preview skipped: repository secret CLI_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js for Wix CLI for Sites
        if: steps.wix-key.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        if: steps.wix-key.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Authenticate Wix CLI for Sites
        if: steps.wix-key.outputs.enabled == 'true'
        env:
          WIX_CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: npm run wix login -- --api-key "$WIX_CLI_API_KEY"

      - name: Install missing Wix Pricing Plans page module
        if: steps.wix-key.outputs.enabled == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); const l=require('./package-lock.json'); process.exit(p.dependencies?.['@wix/site-pricing-plans'] && l.packages?.['node_modules/@wix/site-pricing-plans'] ? 0 : 1)"; then
            echo "@wix/site-pricing-plans is present in package.json and package-lock.json."
          else
            timeout 180s npm run wix install @wix/site-pricing-plans
          fi
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (!p.dependencies?.['@wix/site-pricing-plans'] || !l.packages?.['node_modules/@wix/site-pricing-plans']) { console.error('Wix Pricing Plans package is missing from package.json or package-lock.json after install'); process.exit(1); }"
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(deps): install Wix pricing plans page module"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Verify dependency lockfile, lint, and tests
        if: steps.wix-key.outputs.enabled == 'true'
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test
          npm run test:layer1
          npm run test:layer2

      - name: Build Wix preview from the checked-out revision
        if: steps.wix-key.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import errno
          import fcntl
          import os
          import pty
          import re
          import select
          import signal
          import struct
          import sys
          import termios
          import time

          env = os.environ.copy()
          # The CLI uses CI environment markers to suppress interactive
          # prompts. Remove the runner markers only from this child process;
          # the GitHub Actions workflow itself remains a CI job.
          for marker in ("CI", "GITHUB_ACTIONS", "CONTINUOUS_INTEGRATION", "BUILD_NUMBER", "RUN_ID"):
              env.pop(marker, None)
          # The selector also needs a terminal type; pty.fork() provides the
          # controlling TTY without changing the runner's own environment.
          env["TERM"] = "xterm-256color"
          env["FORCE_COLOR"] = "1"
          pid, master_fd = pty.fork()

          if pid == 0:
              os.execvpe("npm", ["npm", "run", "wix", "preview"], env)

          fcntl.ioctl(master_fd, termios.TIOCSWINSZ, struct.pack("HHHH", 30, 120, 0, 0))
          state = {
              "output": "",
              "selection_started": False,
              "selection_due": None,
              "selected": False,
              "url": None,
          }
          deadline = time.monotonic() + 300
          child_exit = None

          def handle_output(data):
              chunk = data.decode("utf-8", errors="replace")
              sys.stdout.write(chunk)
              sys.stdout.flush()
              state["output"] = (state["output"] + chunk)[-20000:]

              # Wait until the menu and its available source choices are
              # visible. Some CLI builds expose only "Local code"; others
              # also expose "Latest commit from the default branch".
              prompt_visible = re.search(
                  r"What would you like.{0,300}preview", state["output"], re.IGNORECASE | re.DOTALL
              )
              local_option_visible = re.search(r"Local code", state["output"], re.IGNORECASE)
              if not state["selection_started"] and prompt_visible and local_option_visible:
                  if re.search(
                      r"Latest commit from (?:the default branch|origin/main)",
                      state["output"],
                      re.IGNORECASE,
                  ):
                      # Choose Local code only when Wix visibly offers the
                      # default-branch option as the first menu item.
                      os.write(master_fd, b"\x1b[B")
                  state["selection_started"] = True
                  state["selection_due"] = time.monotonic() + 0.5

              if re.search(r"NonInteractiveTerminal|Raw mode is not supported", state["output"]):
                  raise RuntimeError("Wix CLI rejected the controlling terminal.")

              if re.search(r"Failed to deploy site preview|UNSUPPORTED_GITHUB_FILES|PUBLISH_PIPELINE_TASK_NOT_FOUND|Failed to get deployment pipeline details", state["output"], re.IGNORECASE):
                  tail = state["output"][-4000:]
                  raise RuntimeError("Wix CLI reported a Preview deployment error:\n" + tail)

              match = re.search(r"https?://[^\s\x1b]*wix\.to/[^\s\x1b]+", state["output"])
              if match:
                  state["url"] = match.group(0).rstrip(".,);")

          def stop_child():
              # pty.fork() makes the child a session leader; terminate the
              # entire process group so npm cannot leave the Wix CLI orphaned.
              try:
                  os.killpg(pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass

              stop_deadline = time.monotonic() + 3
              while time.monotonic() < stop_deadline:
                  try:
                      waited, _ = os.waitpid(pid, os.WNOHANG)
                  except ChildProcessError:
                      return
                  if waited == pid:
                      return
                  time.sleep(0.1)

              try:
                  os.killpg(pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              try:
                  os.waitpid(pid, 0)
              except ChildProcessError:
                  pass

          try:
              while child_exit is None:
                  waited, status = os.waitpid(pid, os.WNOHANG)
                  if waited == pid:
                      child_exit = os.waitstatus_to_exitcode(status)
                      break

                  now = time.monotonic()
                  if time.monotonic() >= deadline:
                      stop_child()
                      tail = state["output"][-4000:] or "<Wix CLI emitted no output>"
                      sys.stderr.write("\\nLast Wix CLI output before timeout:\\n" + tail + "\\n")
                      raise TimeoutError("Timed out after 300 seconds waiting for Wix CLI Preview.")

                  if (
                      state["selection_started"]
                      and not state["selected"]
                      and state["selection_due"] is not None
                      and now >= state["selection_due"]
                  ):
                      os.write(master_fd, b"\r")
                      state["selected"] = True

                  readable, _, _ = select.select([master_fd], [], [], 0.5)
                  if readable:
                      try:
                          data = os.read(master_fd, 4096)
                      except OSError as error:
                          if error.errno == errno.EIO:
                              continue
                          raise
                      if data:
                          handle_output(data)

              # Drain output written immediately before process exit.
              while select.select([master_fd], [], [], 0)[0]:
                  try:
                      data = os.read(master_fd, 4096)
                  except OSError as error:
                      if error.errno == errno.EIO:
                          break
                      raise
                  if not data:
                      break
                  handle_output(data)

              if child_exit != 0:
                  sys.exit(child_exit)
              if not state["selected"]:
                  sys.stderr.write("Wix preview source selector was not detected; refusing to assume a source.\n")
                  sys.exit(4)
              if not state["url"]:
                  sys.stderr.write("Wix CLI exited without emitting a verifiable wix.to Preview URL.\n")
                  sys.exit(3)
              print(f"\nVerified Wix Preview URL: {state['url']}")
          except (RuntimeError, TimeoutError) as error:
              sys.stderr.write(f"\n{error}\n")
              stop_child()
              sys.exit(2)
          finally:
              os.close(master_fd)
          PY
