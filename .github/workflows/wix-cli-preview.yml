name: Wix CLI preview

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wix.config.json"
      - "package.json"
      - ".github/workflows/wix-cli-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "wix.config.json"
      - "package.json"
      - ".github/workflows/wix-cli-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-cli-preview-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4

      - name: Check Wix CLI API key secret
        id: wix-key
        env:
          WIX_CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "$WIX_CLI_API_KEY" ]; then
            echo "::error::Missing repository secret CLI_API_KEY. Configure it with the 'Wix CLI for Sites - Git Integration' permission."
            echo "Preview blocked: repository secret CLI_API_KEY is missing or unavailable to this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for Wix CLI for Sites
        if: steps.wix-key.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        if: steps.wix-key.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Authenticate Wix CLI for Sites
        if: steps.wix-key.outputs.enabled == 'true'
        env:
          WIX_CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: npm run wix login -- --api-key "$WIX_CLI_API_KEY"

      - name: Build Wix preview from the checked-out revision
        if: steps.wix-key.outputs.enabled == 'true'
        run: npm run wix preview
