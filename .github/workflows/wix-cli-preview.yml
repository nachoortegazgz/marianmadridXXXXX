name: Wix CLI preview

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wix.config.json"
      - "package.json"
      - ".github/workflows/wix-cli-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "wix.config.json"
      - "package.json"
      - ".github/workflows/wix-cli-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-cli-preview-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4

      - name: Check Wix CLI API key secret
        id: wix-key
        env:
          WIX_CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: |
          if [ -z "$WIX_CLI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Wix preview skipped. Add repository secret CLI_API_KEY with the 'Wix CLI for Sites - Git Integration' permission."
            echo "Preview skipped: repository secret CLI_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js for Wix CLI for Sites
        if: steps.wix-key.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        if: steps.wix-key.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Authenticate Wix CLI for Sites
        if: steps.wix-key.outputs.enabled == 'true'
        env:
          WIX_CLI_API_KEY: ${{ secrets.CLI_API_KEY }}
        run: npm run wix login -- --api-key "$WIX_CLI_API_KEY"

      - name: Build Wix preview from the checked-out revision
        if: steps.wix-key.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import errno
          import fcntl
          import os
          import pty
          import re
          import select
          import struct
          import subprocess
          import sys
          import termios
          import time

          env = os.environ.copy()
          env.pop("CI", None)
          master_fd, slave_fd = pty.openpty()
          fcntl.ioctl(slave_fd, termios.TIOCSWINSZ, struct.pack("HHHH", 30, 120, 0, 0))
          process = subprocess.Popen(
              ["npm", "run", "wix", "preview"],
              stdin=slave_fd,
              stdout=slave_fd,
              stderr=slave_fd,
              env=env,
              close_fds=True,
          )
          os.close(slave_fd)

          output_buffer = ""
          selected_local_code = False
          preview_url = None
          deadline = time.monotonic() + 300

          def handle_output(data):
              global output_buffer, selected_local_code, preview_url
              chunk = data.decode("utf-8", errors="replace")
              sys.stdout.write(chunk)
              sys.stdout.flush()
              output_buffer = (output_buffer + chunk)[-20000:]

              if not selected_local_code and re.search(
                  r"What would you like.*preview", output_buffer, re.IGNORECASE | re.DOTALL
              ):
                  # The menu defaults to origin/main; one down-arrow selects
                  # Local code, i.e. the exact checked-out PR/main revision.
                  os.write(master_fd, b"\x1b[B\r")
                  selected_local_code = True

              if re.search(r"NonInteractiveTerminal|Raw mode is not supported", output_buffer):
                  raise RuntimeError("Wix CLI rejected the pseudo-terminal as non-interactive.")

              match = re.search(r"https?://[^\s\x1b]*wix\.to/[^\s\x1b]+", output_buffer)
              if match:
                  preview_url = match.group(0).rstrip(".,);")

          try:
              while process.poll() is None:
                  if time.monotonic() >= deadline:
                      process.terminate()
                      raise TimeoutError("Timed out after 300 seconds waiting for Wix CLI Preview.")
                  readable, _, _ = select.select([master_fd], [], [], 0.5)
                  if readable:
                      try:
                          data = os.read(master_fd, 4096)
                      except OSError as error:
                          if error.errno == errno.EIO:
                              break
                          raise
                      if not data:
                          break
                      handle_output(data)

              # Drain any output written immediately before process exit.
              while select.select([master_fd], [], [], 0)[0]:
                  try:
                      data = os.read(master_fd, 4096)
                  except OSError as error:
                      if error.errno == errno.EIO:
                          break
                      raise
                  if not data:
                      break
                  handle_output(data)

              exit_code = process.wait(timeout=10)
              if exit_code != 0:
                  sys.exit(exit_code)
              if not preview_url:
                  sys.stderr.write("Wix CLI exited without emitting a verifiable wix.to Preview URL.\n")
                  sys.exit(3)
              print(f"\nVerified Wix Preview URL: {preview_url}")
          except (RuntimeError, TimeoutError) as error:
              sys.stderr.write(f"\n{error}\n")
              process.kill()
              process.wait()
              sys.exit(2)
          finally:
              os.close(master_fd)
          PY
