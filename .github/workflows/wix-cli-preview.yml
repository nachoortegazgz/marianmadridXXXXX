name: Wix CLI preview

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "wix.config.json"
      - "package.json"
      - ".github/workflows/wix-cli-preview.yml"

permissions:
  contents: read

concurrency:
  group: wix-cli-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Setup Node.js for Wix CLI for Sites
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate Wix API key secret
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          if [ -z "$WIX_CLI_API_KEY" ]; then
            echo "::error::Missing repository secret WIX_CLI_API_KEY. Create a Wix API key with the 'Wix CLI for Sites - Git Integration' permission, then add it as a repository secret."
            exit 1
          fi
      - name: Authenticate Wix CLI for Sites
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: npm run wix login -- --api-key "$WIX_CLI_API_KEY"
      - name: Build Wix preview from this pull request
        run: npm run wix preview
