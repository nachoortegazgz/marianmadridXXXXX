name: Booking regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Offline booking and backend regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without Wix account postinstall
        run: npm ci --ignore-scripts
      - name: Run canonical regression suite
        run: npm test
