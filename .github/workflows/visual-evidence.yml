name: Marian Madrid visual evidence

on: push

permissions:
  contents: read

jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated Playwright
        run: npm install --prefix "$RUNNER_TEMP" --no-save --package-lock=false --ignore-scripts playwright
      - name: Install Chromium
        run: "$RUNNER_TEMP/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser diagnostics
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p visual-evidence
          cp tests/e2e/live-site-browser-diagnostic.mjs "$RUNNER_TEMP/live-site-browser-diagnostic.mjs"
          node "$RUNNER_TEMP/live-site-browser-diagnostic.mjs"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marianmadrid-live-visual-evidence
          path: visual-evidence/*.png
          if-no-files-found: warn
