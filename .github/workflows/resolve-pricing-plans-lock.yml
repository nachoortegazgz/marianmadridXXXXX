name: Resolve Pricing Plans frontend lockfile

on:
  push:
    branches:
      - feat/pricing-plan-catalog-flow
    paths:
      - .github/workflows/resolve-pricing-plans-lock.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/pricing-plan-catalog-flow

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve exact Wix frontend SDK dependency
        run: npm install --save-exact --package-lock-only --ignore-scripts @wix/site-pricing-plans@1.35.0

      - name: Commit the generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 0
          fi
          git commit -m "build: add pricing plans frontend SDK"
          git push origin HEAD:feat/pricing-plan-catalog-flow
