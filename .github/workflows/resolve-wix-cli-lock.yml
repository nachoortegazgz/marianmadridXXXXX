name: Resolve Wix CLI security update

on:
  push:
    branches:
      - fix/wix-cli-dependency-audit
    paths:
      - .github/workflows/resolve-wix-cli-lock.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dependency audit branch
        uses: actions/checkout@v7
        with:
          ref: fix/wix-cli-dependency-audit

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve exact Wix CLI dependency
        run: npm install --save-exact --package-lock-only --ignore-scripts @wix/cli@1.1.263

      - name: Commit package manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes generated by npm."
            exit 0
          fi
          git commit -m "build: update Wix CLI dependency"
          git push origin HEAD:fix/wix-cli-dependency-audit
