name: Quality diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Dependency and lint diagnostics (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without Wix account postinstall
        run: npm ci --ignore-scripts

      - name: Report npm audit findings
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" 2> "$RUNNER_TEMP/npm-audit-stderr.log"
          audit_status=$?
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RUNNER_TEMP + '/npm-audit.json';
          let audit;
          try {
            audit = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch (error) {
            console.log('npm audit did not return parseable JSON.');
            const stderrPath = process.env.RUNNER_TEMP + '/npm-audit-stderr.log';
            if (fs.existsSync(stderrPath)) console.log(fs.readFileSync(stderrPath, 'utf8').slice(-4000));
            process.exit(0);
          }
          const counts = audit.metadata?.vulnerabilities || {};
          console.log('Vulnerability totals:', JSON.stringify(counts));
          const rows = Object.entries(audit.vulnerabilities || {}).sort((a, b) => {
            const rank = { critical: 0, high: 1, moderate: 2, low: 3, info: 4 };
            return (rank[a[1].severity] ?? 5) - (rank[b[1].severity] ?? 5) || a[0].localeCompare(b[0]);
          });
          for (const [name, item] of rows.slice(0, 50)) {
            const via = (item.via || []).map(entry =>
              typeof entry === 'string' ? entry : [entry.title, entry.url, entry.range].filter(Boolean).join(' | ')
            );
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via,
              effects: item.effects
            }));
          }
          console.log('Packages reported:', rows.length);
          NODE
          echo "npm audit exit code: $audit_status (report-only; no automated package updates)"
          exit 0

      - name: Run ESLint and save diagnostics
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/eslint . --format json > "$RUNNER_TEMP/eslint-report.json" 2> "$RUNNER_TEMP/eslint-stderr.log"
          lint_status=$?
          echo "ESLint exit code: $lint_status (report-only until baseline is understood)"
          node <<'NODE'
          const fs = require('node:fs');
          const p = process.env.RUNNER_TEMP + '/eslint-report.json';
          try {
            const report = JSON.parse(fs.readFileSync(p, 'utf8'));
            let errors = 0;
            let warnings = 0;
            for (const file of report) {
              errors += file.errorCount || 0;
              warnings += file.warningCount || 0;
            }
            console.log(JSON.stringify({ files: report.length, errors, warnings }, null, 2));
            for (const file of report.filter(f => f.errorCount || f.warningCount).slice(0, 60)) {
              console.log(JSON.stringify({
                file: file.filePath,
                errors: file.errorCount,
                warnings: file.warningCount,
                messages: file.messages.slice(0, 8).map(m => ({
                  line: m.line, column: m.column, ruleId: m.ruleId, severity: m.severity, message: m.message
                }))
              }));
            }
          } catch (error) {
            console.log('ESLint report could not be parsed:', String(error));
            const stderrPath = process.env.RUNNER_TEMP + '/eslint-stderr.log';
            if (fs.existsSync(stderrPath)) console.log(fs.readFileSync(stderrPath, 'utf8').slice(-4000));
          }
          NODE
          exit 0
