name: Live public-site smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-pages:
    name: Check published public routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public routes over HTTPS
        run: |
          node --input-type=module <<'NODE'
          const routes = [
            { path: "/", markers: ["marianmadrid.es"] },
            { path: "/reserva-online", markers: ["marianmadrid.es"] },
            { path: "/service-page/babylights-mechas-naturales", markers: ["marianmadrid.es"] },
            { path: "/booking-calendar/rayos-v", markers: ["marianmadrid.es"] },
          ];

          let failures = 0;
          for (const route of routes) {
            const url = new URL(route.path, "https://www.marianmadrid.es");
            try {
              const response = await fetch(url, {
                redirect: "follow",
                headers: { "user-agent": "MarianMadrid-LiveSmoke/1.0" },
                signal: AbortSignal.timeout(15000),
              });
              const contentType = response.headers.get("content-type") || "";
              const body = (await response.text()).toLowerCase();
              const problems = [];
              if (!response.ok) problems.push(`HTTP ${response.status}`);
              if (!contentType.includes("text/html")) problems.push(`unexpected content-type: ${contentType || "(missing)"}`);
              for (const marker of route.markers) {
                if (!body.includes(marker.toLowerCase())) problems.push(`missing marker: ${marker}`);
              }
              if (problems.length) {
                failures++;
                console.error(`FAIL ${url}: ${problems.join("; ")}`);
              } else {
                console.log(`PASS ${url} -> HTTP ${response.status}; ${contentType}`);
              }
            } catch (error) {
              failures++;
              console.error(`FAIL ${url}: ${error?.message || error}`);
            }
          }

          if (failures) {
            console.error(`${failures}/${routes.length} public routes failed.`);
            process.exitCode = 1;
          } else {
            console.log(`All ${routes.length} public routes passed the HTTP smoke check.`);
          }
          NODE
