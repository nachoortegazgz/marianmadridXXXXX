name: Live public-site semantic smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-pages:
    name: Check published public routes and content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public routes over HTTPS
        run: |
          node --input-type=module <<'NODE'
          const origin = "https://www.marianmadrid.es";
          const routes = [
            {
              path: "/",
              required: ["reserva 24/7", "servicios"],
            },
            {
              path: "/reserva-online",
              required: ["reserva"],
            },
            {
              path: "/service-page/babylights-mechas-naturales",
              required: ["babylights"],
            },
            {
              path: "/booking-calendar/rayos-v",
              required: [],
            },
            {
              path: "/politica-privacidad-texto",
              required: ["titular"],
              forbidden: [
                "[número de identificación fiscal]",
                "[incluir email de contacto]",
                "lorem ipsum",
              ],
            },
          ];
          const globalForbidden = [
            "¡nos vemos muy pronto!",
            "hasta entonces nos vemos en nuestras redes",
            "lorem ipsum",
          ];

          let failures = 0;
          for (const route of routes) {
            const url = new URL(route.path, origin);
            try {
              const response = await fetch(url, {
                redirect: "follow",
                headers: { "user-agent": "MarianMadrid-LiveSemanticSmoke/2.0" },
                signal: AbortSignal.timeout(15000),
              });
              const contentType = response.headers.get("content-type") || "";
              const body = (await response.text()).toLowerCase();
              const problems = [];
              if (!response.ok) problems.push(`HTTP ${response.status}`);
              if (!contentType.includes("text/html")) {
                problems.push(`unexpected content-type: ${contentType || "(missing)"}`);
              }
              for (const marker of route.required || []) {
                if (!body.includes(marker.toLowerCase())) problems.push(`missing content marker: ${marker}`);
              }
              for (const marker of [...globalForbidden, ...(route.forbidden || [])]) {
                if (body.includes(marker.toLowerCase())) problems.push(`forbidden placeholder/maintenance marker: ${marker}`);
              }
              const title = (body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || "")
                .replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 180);
              if (problems.length) {
                failures++;
                console.error(`FAIL ${url} (final URL: ${response.url}; title: ${title || "(missing)"}; body bytes: ${Buffer.byteLength(body)}): ${problems.join("; ")}`);
                for (const marker of [...globalForbidden, ...(route.forbidden || [])]) {
                  const at = body.indexOf(marker.toLowerCase());
                  if (at >= 0) console.error(`DIAGNOSTIC ${route.path} around "${marker}": ${body.slice(Math.max(0, at - 180), Math.min(body.length, at + marker.length + 180)).replace(/\s+/g, " ")}`);
                }
                if (route.path.includes("booking-calendar")) {
                  const indicators = ["rayos", "availability", "available", "no availability", "no hay", "error", "service", "calendar", "booking"];
                  console.error(`DIAGNOSTIC booking-calendar indicators: ${indicators.filter(value => body.includes(value)).join(", ") || "(none)"}`);
                  console.error(`DIAGNOSTIC booking-calendar HTML excerpt: ${body.slice(0, 1200).replace(/\s+/g, " ")}`);
                }
              } else {
                console.log(`PASS ${url} -> HTTP ${response.status}; title: ${title || "(missing)"}; required content present; no known placeholders`);
              }
            } catch (error) {
              failures++;
              console.error(`FAIL ${url}: ${error?.message || error}`);
            }
          }

          if (failures) {
            console.error(`${failures}/${routes.length} public routes failed semantic smoke checks.`);
            process.exitCode = 1;
          } else {
            console.log(`All ${routes.length} public routes passed semantic smoke checks.`);
          }
          NODE

  browser-e2e:
    name: Browser checks (read-only; no bookings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public-site browser diagnostics
        run: node tests/e2e/live-site-browser-diagnostic.mjs
