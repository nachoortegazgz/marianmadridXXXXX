name: Security remediation preview

on:
  push:
    branches: [fix/security-node-gyp-overrides-20261023]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-remediation-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    name: Validate patched dependency overrides on isolated branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from reviewed overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit lockfile update on isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
          else
            git commit -m "security: lock patched node-gyp and tar versions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install exact candidate lockfile
        run: npm ci --ignore-scripts

      - name: Confirm resolved tooling versions
        run: |
          npx wix --version
          npm ls node-gyp tar --all

      - name: Lint
        run: npm run lint

      - name: Backend regression suite
        run: npm test

      - name: Fail on remaining critical or high vulnerabilities
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit-candidate.json" 2> "$RUNNER_TEMP/npm-audit-candidate-stderr.log"
          audit_status=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const file = process.env.RUNNER_TEMP + '/npm-audit-candidate.json';
          const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
          const counts = audit.metadata?.vulnerabilities || {};
          console.log('Candidate audit totals:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via || []).map(v => typeof v === 'string' ? v : v.title)
            }));
          }
          if ((counts.critical || 0) > 0 || (counts.high || 0) > 0) {
            console.error('Candidate still has critical/high findings; do not merge.');
            process.exit(1);
          }
          NODE
          if [ "$audit_status" -ne 0 ]; then
            echo "npm audit returned a non-zero code; inspect the report above."
          fi
