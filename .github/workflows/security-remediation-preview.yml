name: Security remediation preview

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-remediation-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Preview npm audit fixes without changing files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install lockfile exactly
        run: npm ci --ignore-scripts

      - name: Preview security updates only
        shell: bash
        run: |
          set +e
          npm audit fix --dry-run --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/npm-audit-fix-dry-run.log"
          audit_fix_status=${PIPESTATUS[0]}
          echo "npm audit fix --dry-run exit code: $audit_fix_status"
          exit 0

      - name: Report baseline vulnerability tree
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" 2> "$RUNNER_TEMP/npm-audit-stderr.log"
          node -e "const fs=require('node:fs');const p=process.env.RUNNER_TEMP+'/npm-audit.json';try{const a=JSON.parse(fs.readFileSync(p,'utf8'));console.log('Vulnerability totals:',JSON.stringify(a.metadata?.vulnerabilities||{}));for(const [name,item] of Object.entries(a.vulnerabilities||{})){console.log(JSON.stringify({package:name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:(item.via||[]).map(v=>typeof v==='string'?v:v.title),effects:item.effects}));}}catch(e){console.log('Could not parse npm audit output',String(e));}"
          exit 0
